# Configuration for tools/style_gate.py -- see code-style.md.
# Nothing here changes the rules; it says which files in THIS tree they
# apply to, and how small the file list may get before a pass is a lie.

# Migration only: the columns a level occupied before this tree was
# converted. Checking never reads it -- a tab carries the level and the
# viewer decides how wide it looks.
indent_width = 2

# Below this the gate fails instead of passing. Deliberately under the
# real count: it catches a collapsed file list, it does not police a
# number, so adding files never requires touching it.
floor = 150

exclude = ["attic", "third_party", "vendor", "build", "target",
           "dist", ".pytest_cache", ".claude",
           "build-android", "evidence", "state", "icons", ".fmake"]

# ASCII outside string literals, which is the rule in code-style.md.
#
# This tree ran without it for a long time and its comments collected 849
# non-ASCII characters across 163 files -- 602 em dashes, 376 section signs
# and 74 ellipses among them -- none of which anybody decided to add. They
# arrived one paste at a time, which is what a rule that is off does.
#
# It could not be switched on before: the check was a whole-file byte test,
# and this program legitimately prints glyphs -- the toolbar arrows, the
# media dialog's play and download marks, the transfer marker. Turning it on
# would have meant giving those up. The gate lexes C and C++ now, so a glyph
# inside a string literal is output and stays, and an em dash in a comment is
# prose and does not. 240 characters inside literals were counted before the
# conversion and counted again after it, unchanged.
ascii_only = true

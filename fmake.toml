# What fmake cannot work out about this tree.
#
# Everything else it does: every Q_OBJECT header, the moc runs, the four
# android_* sources excluded by name, and a link set closed over symbols. The
# six facts it has to be told are annotations in the sources themselves --
# `@target` in main.cpp and one `@pkg_optional` beside each optional
# dependency's include. This file holds the one fact that belongs to no single
# source file.
#
# **Build directories contain generated C++.** `build/` and `build-android/`
# hold the moc and qrc output qmake wrote, `test/build-make/` the test tree's.
# Left alone, fmake reads them as sources: it started compiling
# `build-android/moc_main_window.cpp` -- generated for arm64 -- as an x86-64
# translation unit, 196 of them against the 116 that are real, and every symbol
# in them a second definition of something already compiled from `src/`.
#
# **fmake reads `.gitignore` now, and this list is no longer the only thing
# saying so.** It reports what it skipped -- "117 source file(s) not built: git
# is told to ignore build-android-arm64-v8a, test/build-make and 2 more" --
# and both the packaged build and the current one do it. Measured 2026-09-21,
# entry by entry:
#
#     build/              exists, ignored by git    -- belt and braces
#     test/build-make/    exists, ignored by git    -- belt and braces
#     third_party/        exists, TRACKED           -- only this list covers it
#     build-android-*/    exists, ignored by git    -- belt and braces
#     build-qmake/, attic/  do not exist here
#
# Kept rather than pruned, because an exclude written here does not depend on
# a tool continuing to read a file it is not obliged to read. `third_party/` is
# the one entry that carries its own weight regardless: it is the vendored
# yt-dlp, it is tracked, and nothing else would keep fmake out of it.
#
# **`build-android/**` was wrong and is now `build-android-*/**`.** The
# directory is named per ABI -- `build-android-arm64-v8a` -- which the old
# pattern never matched. Nothing broke, because `.gitignore` carries
# `/build-android*/` and fmake honours it; the entry was simply not doing the
# job it was written for.
#
# And the correction is unverified for the same reason, which is worth saying
# rather than implying otherwise: while `.gitignore` covers those paths, no
# experiment here can tell an exclude that matches from one that does not. What
# was checked is that fmake still reads this file -- the define below still
# reaches the compile line -- and that the directory is skipped either way.
#
# **`HYDRA_VERSION` is injected by the build, not written in any source.**
# `main.cpp` prints it for `--version`, and the Makefile defines it from the
# `VERSION` file so the number lives in one place. fmake reads the sources and
# not the Makefile, so without this it stops on an undefined identifier -- and
# it says so precisely, naming the line it would need.
#
# **The value here is deliberately not the version**, and this is not a second
# copy of it going stale. `make objsets` compiles the tree only to read its
# symbol tables; the objects are thrown away and nothing built here is ever
# run or shipped, so what the string says is irrelevant and saying `0.1` would
# invite somebody to keep it in step with a file it has nothing to do with.
# **`include-dirs` is what lets the test tree compile from the repository
# root.** The suites say `#include "theme.h"` from `test/`, where the quoted
# form does not resolve -- `src/theme.cpp` says the same words and needs no
# `-I` at all, because a quoted include is looked for beside the including
# file first. Without this fmake stops on 72 of them, each naming the header
# it wanted and this option as the fix.
#
# Measured before adding it, because it changes what `make -C test objsets`
# compiles: with it the whole tree builds and `fmake hydra` exits 0, and the
# link sets it computes are **identical** -- 88 programs, 5218 objects, the
# same multiset of objects per program.
#
# **The paragraph that stood here claimed this file had settled the
# `QDBusVariant` collision, and it had not.** `theme.h` defines a stub
# `QDBusVariant` when `HYDRA_HAVE_DBUS` is absent so the header keeps one shape
# either way; `test/test_theme.cpp` constructs a real one; and the claim was
# that the `include-dirs` entry above fixed it, "checked in
# `compile_commands.json`". **An include path cannot supply a `-D`.** Whatever
# that check read, it was not this question -- most likely the Makefile's
# database, which does define the macro, rather than this tool's.
#
# It is live. `make -C test objsets` stopped on 2026-09-29 with
#
#     src/theme.h:9: class QDBusVariant {};
#     test/test_theme.cpp:702: no matching function for call to
#                              'QDBusVariant::QDBusVariant(int)'
#     * test_theme skipped: test/test_theme.cpp did not compile
#     fmake --eject failed
#
# **And the run that produced it was not the fmake anybody meant.**
# `tool/objsets.py` resolves the binary as `$FMAKE` or PATH, and with `FMAKE`
# unset PATH gave `/usr/bin/fmake` -- the packaged copy, 2026-08-04, build
# `5af02348` -- while the header of `objsets.mk` records that its contents were
# generated by `/home/claude/src/fmake/fmake`, a different build. So the failure
# above is a fact about a two-month-old binary and not about this tree's
# annotations, and the mechanism first written here was withdrawn rather than
# narrowed. **Name the fmake when regenerating**; the header of `objsets.mk`
# says which one answered, and `--version` cannot tell two of them apart.
#
# No macro is stated here for it. fmake gives a `@pkg_optional` *macro* to the
# whole tree but that package's *cflags* only to the file carrying the
# annotation, so `-DHYDRA_HAVE_DBUS` here would define the macro everywhere
# without giving anyone Qt6DBus's include path -- trading a stub collision for a
# missing header. Reported by fmake, and the reason this entry is one line
# shorter than a first attempt at it.
[project]
include-dirs = ['src']
cflags  = ['-DHYDRA_VERSION="(link sets only; see fmake.toml)"']
exclude = ["build/**", "build-android-*/**", "build-qmake/**",
            "test/build-make/**", "third_party/**", "attic/**"]

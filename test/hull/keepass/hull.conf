; try_keepass against a real KeePassXC, in a machine hull runs.
;
; The bridge had never met a KeePassXC, and the one on the holder's account
; is a real vault, which a test must not pair with. So this machine brings its
; own: a throwaway database made at the start of the run, a KeePassXC on a
; virtual display, and its own HOME and runtime directory -- the browser socket
; lives in the runtime directory, so the one inside cannot be the host's.
;
;     make hull-keepass        ; builds the image when absent, then runs
;     make hull-keepass-image  ; builds it again, on purpose
;
; By hand, from anywhere -- hull resolves this file's paths against its own
; directory:
;     hull build -f test/hull/keepass/hull.conf hydra/keepass
;     hull run   -f test/hull/keepass/hull.conf
(build
  (base "docker.io/library/debian:trixie-slim")
  (steps
    (step
      (name "keepass")
      (network true)
      ; keepassxc and keepassxc-cli; a display for it, and a hand for the one
      ; dialog a pairing raises; a Secret Service, which is where the bridge
      ; keeps a pairing; and the libraries the host-built drivers link, which
      ; the host shares this release with -- try_autofill is the whole shell,
      ; so QtWebEngine, its helper process and a font come too.
      (run "set -eu
export DEBIAN_FRONTEND=noninteractive
apt-get -qq update
apt-get -qq install -y --no-install-recommends keepassxc xvfb xdotool libqt6core6t64 libqt6network6 libsecret-1-0 libsodium23 dbus dbus-daemon gnome-keyring libqt6webenginewidgets6 libqt6webenginecore6-bin qt6-qpa-plugins qt6-svg-plugins libqt6quickwidgets6 libqt6positioning6 libqt6printsupport6 libtorrent-rasterbar2.0t64 liblz4-1 libxxhash0 libnss3 fonts-dejavu-core
apt-get clean
for t in keepassxc keepassxc-cli Xvfb xdotool dbus-run-session gnome-keyring-daemon; do
	command -v $t >/dev/null || { echo \"missing from the image: $t\"; exit 1; }
done
echo \"keepass image: $(keepassxc-cli --version)\"")
      (inputs))))

(machine
  (source "hydra/keepass")
  (mutable overlay)
  (backend chroot)
  ; Nothing in this run needs the internet, and nothing in it should reach it.
  (network none)
  (volumes
    (volume (host "../../..") (guest "/mnt/repo") (mode ro))
    (volume (host ".") (guest "/payload") (mode ro)))
  (command "sh" "/payload/payload.sh"))

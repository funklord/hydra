# Continuous integration.
#
# Two jobs, split by what they cost. The gates need python3 and nothing else
# and finish in seconds; the build needs Qt WebEngine and does not. Keeping
# them apart means a misplaced tab is reported in under a minute rather than
# after a twenty-minute compile, and that a failed build does not hide a
# failed gate.
#
# **Spaces, not tabs.** The YAML spec forbids tabs for indentation outright,
# which is one of the settled exceptions in code-style.md rather than a
# divergence from it.
#
# **A green check has to mean something was checked.** Every job here asserts
# that it inspected a plausible number of things before it is allowed to pass:
# an empty file list, a collapsed suite list or a test binary that did not
# rebuild all report success exactly as loudly as a real pass. The style gate
# carries its own floor (`.style-gate.toml`), and the counts below are the
# same idea for the parts that have none.
name: ci

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# A second push supersedes the first. These builds are long enough that
# queueing them all wastes the runner on results nobody will read.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    name: style and document gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false

      # `make style` is three gates now: the shared source gate, the
      # project.md document gate, and the JNI name check. The last one is here
      # rather than in the build job on purpose -- it is pure text, it needs no
      # Android tooling at all, and the mistake it exists to catch reached a
      # signed APK without any build failing.
      - name: Run the gates
        run: make style

      # `make style` runs the source gate and the document gate. The source
      # gate refuses to pass on fewer than 150 files by its own configuration,
      # so it cannot come back green over an empty list; this is the same
      # assurance for the document gate, which has no floor of its own.
      - name: The document gate actually read project.md
        run: |
          test -s project.md || { echo "project.md is empty or missing"; exit 1; }
          lines=$(wc -l < project.md)
          test "$lines" -gt 1000 || {
            echo "project.md is $lines lines; expected thousands."
            echo "A gate over a truncated file passes for the wrong reason."
            exit 1
          }

  build:
    name: build and offline suites
    runs-on: ubuntu-latest
    # **Debian trixie, not the runner's own Ubuntu.** ubuntu-24.04 ships Qt
    # 6.4.2 and this needs 6.8 -- which is what the first CI run found, as two
    # hundred lines of "'ColorScheme' is not a member of 'Qt'". Trixie ships
    # 6.8 and is what the developer's machine runs, so CI now builds against
    # the same Qt as the person writing the code rather than an older one
    # nobody uses.
    container: debian:trixie
    steps:
      # Before checkout, deliberately: actions/checkout falls back to
      # downloading a tarball over the API when the container has no git,
      # which works and then leaves no repository for anything to inspect.
      #
      # **Every direct dependency named, including the two that arrive anyway.**
      # `qt6-webengine-dev` pulls in `qt6-declarative-dev` and
      # `qt6-webchannel-dev`, so a shorter list builds -- and this project uses
      # both directly, while the Android build asks for no WebEngine at all,
      # which is exactly where a transitively-satisfied dependency stops being
      # satisfied. The same list is in README.md and in debian/control's
      # Build-Depends; the latter two were missing three packages between them
      # until somebody wrote the list down and compared it.
      - name: Install Qt and the optional dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            git ca-certificates make build-essential pkgconf python3 \
            qt6-base-dev qt6-base-dev-tools qt6-declarative-dev \
            qt6-webchannel-dev qt6-webengine-dev libgl1-mesa-dev \
            libsodium-dev libsecret-1-dev liblz4-dev \
            libtorrent-rasterbar-dev

      # `third_party/yt-dlp` is a runtime tool rather than a build input, so it
      # is not fetched and the build does not need it. What that costs is one
      # assertion: `test_ytdlp` checks that the resolver finds a vendored copy
      # when one exists, and here none does, so it takes its other branch --
      # that the resolver reports unavailable rather than claiming a program it
      # has not got. The log says `skipped:` with the reason when it does.
      #
      # That is the branch a fresh clone without `--recurse-submodules` hits,
      # which the README warns about, so it is worth covering; the other branch
      # runs on every developer machine. `submodules: true` here would cover
      # both, at the cost of cloning yt-dlp on every run.
      - uses: actions/checkout@v7
        with:
          submodules: false

      # The floor is 6.8 and hydra.pro refuses anything older by name, so this
      # is a statement of what was built rather than a gate. Printed because a
      # build log that does not say which Qt it used cannot be argued with
      # later.
      - name: Say which Qt this is
        run: |
          qmake6 -query QT_VERSION
          test "$(qmake6 -query QT_VERSION | cut -d. -f1-2)" != "6.4" || {
            echo "Qt 6.4 cannot build this; see hydra.pro"
            exit 1
          }

      # The qualified name, never the bare `libtorrent`: two unrelated
      # projects install a .pc by that name and the bare one resolves to
      # rakshasa's different API.
      - name: Every optional feature is actually available
        run: |
          missing=0
          for pkg in libsodium libsecret-1 liblz4 libtorrent-rasterbar; do
            if pkg-config --exists "$pkg"; then
              echo "ok      $pkg"
            else
              echo "MISSING $pkg"
              missing=1
            fi
          done
          test "$missing" -eq 0 || {
            echo
            echo "A build without these is smaller and still green, which is"
            echo "why this is checked rather than assumed."
            exit 1
          }

      - name: Build the app
        run: make JOBS=2

      - name: The build produced a binary with its features in it
        run: |
          test -x build/hydra || { echo "no build/hydra"; exit 1; }
          for lib in sodium secret-1 lz4 torrent-rasterbar; do
            ldd build/hydra | grep -q "$lib" || {
              echo "build/hydra does not link $lib"
              exit 1
            }
          done
          echo "links all four optional libraries"

      # **As an ordinary user, because root cannot fail to write a file.**
      #
      # A container job runs as root, and for uid 0 the permission bits are
      # advice: a 0400 file opens for writing without complaint. Every
      # assertion in the suite of the form "this save should fail" therefore
      # could not fail, and three of them were red here while green on every
      # developer machine -- the tests were wrong about the environment, not
      # about the code.
      #
      # Skipping them under root was the other available answer and is also in
      # the suite, for anyone who runs it as root by hand. This is the better
      # half of the pair: it makes the checks run rather than excusing them,
      # and it is how the application is actually used. A green run that
      # silently disabled a class of assertion is the vacuous pass this file's
      # header says every job here must refuse.
      #
      # The build above ran as root, so the tree it produced has to change
      # hands before the suite can write its own build directory into it.
      - name: Run the offline suites
        run: |
          useradd -m ci
          chown -R ci:ci .
          su ci -c "cd '$PWD' && make test JOBS=2"

      # **The live drivers, compiled but not linked.** Linking them means
      # thirty-five Qt WebEngine links, and running them wants a display, so
      # neither belongs in a job that has to finish. Compiling them costs
      # thirty-five translation units and catches the thing that actually kept
      # happening: a change to the shell that breaks a driver's compilation,
      # found by hand after the fact because nothing here built them.
      - name: Compile the live drivers
        run: make -C test JOBS=2 live-objs

      - name: Every driver was compiled, not skipped
        run: |
          built=$(ls test/build-make/try_*.o 2>/dev/null | wc -l)
          want=$(ls test/live/try_*.cpp | wc -l)
          echo "$built driver objects for $want sources"
          test "$built" -eq "$want" || {
            echo 'a driver did not compile, or the glob found nothing.'
            exit 1
          }

      # `make test` loops over a computed suite list and exits non-zero when
      # one fails -- but an empty list would exit zero having run nothing at
      # all, which is the shape of vacuous pass this repository keeps meeting.
      - name: The suite list did not collapse
        run: |
          found=$(ls test/test_*.cpp | wc -l)
          echo "$found suite sources"
          test "$found" -ge 30 || {
            echo "expected at least 30; a shrunken list passes for free."
            exit 1
          }
          built=$(find test/build-make -maxdepth 1 -type f -executable \
                    -name 'test_*' | wc -l)
          echo "$built suite binaries built"
          test "$built" -ge 25 || {
            echo 'expected at least 25 binaries; make test cannot have run them.'
            exit 1
          }

      # The link sets are generated and committed, and the Makefile refuses to
      # build when they no longer describe the tree -- so reaching this point
      # already proves they match. Kept as its own step so that when it does
      # fail, the log says what to do about it.
      - name: The committed link sets match the tree
        if: always()
        run: |
          echo "test/Makefile compares objsets.mk against its own glob on"
          echo "every build; a mismatch stops it with the regeneration command."
          echo "Reaching this step means they agreed."
